name: Deploy game to GitHub Pages

# Publishes the Main/ folder to GitHub Pages so the game is playable at a
# clean URL: https://mygameindie.github.io/Potion/
#
# One-time setup: in the repo, go to Settings → Pages → Build and deployment →
# Source: "GitHub Actions". After this workflow lands on the default branch it
# deploys automatically; you can also run it manually from the Actions tab.

on:
  push:
    branches: [main, claude/zip-extract-organize-ediwt4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (build_type: workflow) so no manual Settings step is needed.
          enablement: true

      - name: Upload site (Main/ as the site root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: Main

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
